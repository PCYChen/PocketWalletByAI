# 本機開發請直接啟動 MySQL、backend、frontend，不必先用 Docker。
# 只啟動資料庫：docker compose up -d mysql
# 以後要整套容器化：docker compose --profile stack up --build

services:
  mysql:
    image: mysql:8.0
    container_name: pocket-wallet-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project root .env}
      MYSQL_DATABASE: pocket_wallet
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - pocket_wallet_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["stack"]
    build: ./backend
    container_name: pocket-wallet-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pocket_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

  frontend:
    profiles: ["stack"]
    build: ./frontend
    container_name: pocket-wallet-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pocket_wallet_mysql:
